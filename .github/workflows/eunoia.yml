name: Checked cvc5 Eunoia backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  eunoia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned solver, build, and check public proofs
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/work" -w /work \
            --entrypoint /bin/bash \
            ghcr.io/rocq-trakt/rocq@sha256:21d9edc7a97aabe15577ae442854c2a03cc81097ff7b5fa899d8d6fe62d05c68 \
            -lc 'sh scripts/eunoia/ci.sh'
