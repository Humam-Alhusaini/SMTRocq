name: Verify writing style

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@v1
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Verify dune style
        run: |
          git ls-files '*dune' 'dune-project' 'dune-workspace' | \
            nix shell nixpkgs#dune -c xargs -I {} bash -c 'diff -u {} <(dune format-dune-file {})'

      - name: Verify Nix style
        run: nix fmt . -- --ci
